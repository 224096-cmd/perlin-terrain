# main ブランチに push されるたびに、リポジトリの中身をそのまま GitHub Pages に公開する。
# （ビルド作業は無し。置いてあるファイルがそのまま公開される）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動で実行できるようにする
  workflow_dispatch:

# GitHub Pages への公開に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようにする（実行中のものは最後まで通す）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
